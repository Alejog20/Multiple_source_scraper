name: Deploy to EC2

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    # Runs only when explicitly enabled (Settings -> Variables -> Actions ->
    # DEPLOY_ENABLED=true) — until the EC2 instance + OIDC role exist, this
    # job is skipped (grey), not failed (red). Also gated so a successful
    # "Tests" run only triggers a deploy when it ran on master.
    if: >
      vars.DEPLOY_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'master'
        )
      )
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy via SSM Run Command (no SSH, no port 22)
        id: send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --comment "Deploy ${{ github.sha }} via GitHub Actions" \
            --parameters commands='[
              "cd /opt/scraper-bot",
              "git fetch origin master",
              "git reset --hard origin/master",
              "export GIT_SHA=$(git rev-parse --short HEAD)",
              "docker compose build --build-arg GIT_SHA=$GIT_SHA",
              "docker compose up -d",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the command to finish
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.send-command.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Show command output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.send-command.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
