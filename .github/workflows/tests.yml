name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run scraper parsing tests (test_scrapers.py)
        run: uv run python -m unittest test_scrapers -v

      - name: Run core engine / scheduler tests (tests/test_scheduler.py)
        run: uv run python -m unittest tests.test_scheduler -v
